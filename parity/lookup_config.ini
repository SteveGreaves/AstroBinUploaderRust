# Config for check_log.py's network-lookup scenario only.
#
# Not golden_config.ini: that file is frozen and blessed against committed
# references (see its own header). This one exists to make every coordinate
# in the corpus it is run against "unknown" -- [sites] is empty -- and to
# point the sky-quality half of SiteLookup at a local stub server rather
# than the real lightpollutionmap.info, so the scenario stays offline
# despite exercising the network *code path*. No EMAIL_ADDRESS: Nominatim's
# terms of service require a real contact address, which a stub cannot
# supply, so reverse geocoding is deliberately left disabled here and
# exercised live instead (PORT_PLAN.md Phase 7).
#
# [secret]'s key is swapped for the stub's actual "http://127.0.0.1:<port>/"
# by check_log.py before each run; ENDPOINT_PLACEHOLDER below is never used
# as-is.
[defaults]
        IMAGETYP = LIGHT
        EXPOSURE = 0
        DATE-OBS = 2023-01-01
        XBINNING = 1
        GAIN = -1
        EGAIN = -1
        INSTRUME = None
        TELESCOP = None
        FOCNAME = None
        FWHEEL = None
        ROTNAME = None
        ROTANTANG = 0
        XPIXSZ = 3
        CCD-TEMP = -10
        FOCALLEN = 540
        FOCRATIO = 5
        SITE = Unknown Site
        SITELAT = 0.0000
        SITELONG = 0.0000
        BORTLE = 4
        SQM = 21
        FILTER = No Filter
        OBJECT = No target
        FOCTEMP = 20
        HFR = 1
        FWHM = 0
        SWCREATE = Unknown package
        USEOBSDATE = False
[override]
        SITE = SITENAME
        SQM = AOCSKYQ, AOCSKYQU
        FOCTEMP = AOCAMBT
[filters]
        Ha = 4663
        SII = 4844
        OIII = 4752
        Red = 4649
        Green = 4643
        Blue = 4637
        Lum = 2906
[secret]
        ABCDEF1234567890 = ENDPOINT_PLACEHOLDER
[sites]
