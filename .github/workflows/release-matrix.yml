name: Release matrix

# PORT_PLAN.md decision 2: five targets, no C runtime anywhere (the FITS
# reader is hand-written specifically so this holds) -- musl gives a fully
# static Linux binary, the rest link against each platform's own libc/CRT.
#
# Manual trigger for now (`gh workflow run release-matrix.yml`), plus tags,
# because a cross-platform matrix costs real Actions minutes on every leg and
# this repo has no release process yet to hang an every-push run off of.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            can_run: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            can_run: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            # Cross-compiles fine from an x64 host with the MSVC ARM64
            # toolset, but the runner's own CPU cannot execute the result.
            can_run: false
          - target: x86_64-apple-darwin
            os: macos-latest
            # macos-latest runners are Apple Silicon; running an x86_64
            # binary needs Rosetta, which is not guaranteed present.
            can_run: false
          - target: aarch64-apple-darwin
            os: macos-latest
            can_run: true
    runs-on: ${{ matrix.os }}
    steps:
      # Windows' 260-character MAX_PATH is shorter than some committed
      # fixture paths (parity/fixtures/binary/xisf_mixed/registered/... has
      # real WBPP-generated names, and shortening them would mean the corpus
      # no longer matches what it documents having captured). Git itself
      # supports long paths past that limit; it just has to be told to, and
      # that has to happen before checkout, not after -- the clone is where
      # the limit bites.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # musl needs a musl-targeting C toolchain on the host for the final
      # link step, even though nothing in this crate is C. gnu/msvc/darwin
      # targets link against a libc/CRT the runner image already has.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Only where the runner's own architecture can execute the result --
      # cargo test builds and runs, it does not just compile. The parity
      # harnesses (parity/*.py) are not run here: they need Python, pandas
      # and the sibling AstroBinUploader checkout, none of which belongs in a
      # release build's CI, and the Linux gnu target -- not part of this
      # matrix, but exercised on every push in CI proper -- already carries
      # that verification for the logic these targets share.
      - name: Test
        if: matrix.can_run
        run: cargo test --release --target ${{ matrix.target }}

      # What a user needs to run the program, and nothing else: the
      # executable, a configuration to start from (the binary refuses to run
      # without a config.ini and will not invent one), the licence GPL-3.0
      # requires travel with a binary, and usage documentation. Development
      # material -- the parity corpus, the harnesses, the port plan -- stays
      # in the repository and out of what is shipped.
      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          dir="astrobin-upload-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/astrobin-upload" "$dir/"
          cp packaging/config.ini.example packaging/README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "astrobin-upload-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/astrobin-upload.exe" $dir
          Copy-Item packaging/config.ini.example, packaging/README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrobin-upload-${{ matrix.target }}
          path: |
            astrobin-upload-${{ matrix.target }}.tar.gz
            astrobin-upload-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  # Tags only. `workflow_dispatch` builds the matrix for checking; it must not
  # cut a release as a side effect.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No `name:`, so all five artifacts download into per-artifact
      # subdirectories; each holds exactly one archive.
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          find packages -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $(find packages -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
