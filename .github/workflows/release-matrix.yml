name: Release matrix

# PORT_PLAN.md decision 2: five targets, no C runtime anywhere (the FITS
# reader is hand-written specifically so this holds) -- musl gives a fully
# static Linux binary, the rest link against each platform's own libc/CRT.
#
# Manual trigger for now (`gh workflow run release-matrix.yml`), plus tags,
# because a cross-platform matrix costs real Actions minutes on every leg and
# this repo has no release process yet to hang an every-push run off of.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            can_run: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            can_run: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            # Cross-compiles fine from an x64 host with the MSVC ARM64
            # toolset, but the runner's own CPU cannot execute the result.
            can_run: false
          - target: x86_64-apple-darwin
            os: macos-latest
            # macos-latest runners are Apple Silicon; running an x86_64
            # binary needs Rosetta, which is not guaranteed present.
            can_run: false
          - target: aarch64-apple-darwin
            os: macos-latest
            can_run: true
    runs-on: ${{ matrix.os }}
    steps:
      # Kept after the parity corpus was untracked: Windows'
      # 260-character MAX_PATH used to bite on the committed WBPP fixture
      # names, and nothing tracked reaches that length today -- but git has
      # to be told before checkout, not after, so re-adding it later means
      # discovering the limit on a release build again. It costs nothing.
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      # musl needs a musl-targeting C toolchain on the host for the final
      # link step, even though nothing in this crate is C. gnu/msvc/darwin
      # targets link against a libc/CRT the runner image already has.
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Only where the runner's own architecture can execute the result --
      # cargo test builds and runs, it does not just compile. These unit
      # tests are now the whole of CI's verification: the parity harnesses
      # need Python, pandas, the sibling AstroBinUploader checkout and the
      # corpus, and the corpus is deliberately untracked, so every
      # byte-comparison against the Python oracle is run by hand on the
      # maintainer's machine instead. Three of the five targets set
      # `can_run`; the other two cross-compile without executing anything,
      # so a defect specific to those two cannot be caught here.
      - name: Test
        if: matrix.can_run
        run: cargo test --release --target ${{ matrix.target }}

      # What a user needs to run the program, and nothing else: the
      # executable, a configuration to start from (the binary refuses to run
      # without a config.ini and will not invent one), the licence GPL-3.0
      # requires travel with a binary, and usage documentation. Development
      # material -- the parity corpus, the harnesses, the port plan -- is
      # untracked and never reaches a release.
      - name: Stage package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          dir="astrobin-upload-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/astrobin-upload" "$dir/"
          cp config.ini.example README.md LICENSE "$dir/"
          cp -r images "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - name: Stage package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "astrobin-upload-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/astrobin-upload.exe" $dir
          Copy-Item config.ini.example, README.md, LICENSE $dir
          Copy-Item -Recurse images $dir
          # Compress-Archive's treatment of a bare directory path differs
          # between PowerShell versions -- some put the folder at the zip root,
          # some its contents. The .NET call takes it as an explicit argument,
          # so the archive matches the tarball's shape on every runner.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path $dir).Path,
            (Join-Path (Get-Location).Path "$dir.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true)
          # Prove the shape in the log rather than trusting it.
          [System.IO.Compression.ZipFile]::OpenRead(
            (Join-Path (Get-Location).Path "$dir.zip")
          ).Entries | ForEach-Object { $_.FullName } | Select-Object -First 6

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrobin-upload-${{ matrix.target }}
          path: |
            astrobin-upload-${{ matrix.target }}.tar.gz
            astrobin-upload-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  # Tags only. `workflow_dispatch` builds the matrix for checking; it must not
  # cut a release as a side effect.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No `name:`, so all five artifacts download into per-artifact
      # subdirectories; each holds exactly one archive.
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages

      # Written out rather than `--generate-notes`: generated notes are built
      # from commit messages, which are development history and have no place
      # on a page users download from. Deliberately not a changelog either --
      # what a user needs here is what the program is, why it is worth having,
      # which file to take and how to start. Per-version detail, when it is
      # worth publishing at all, goes in ReleaseNotes.md.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          find packages -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print
          cat > notes.md <<'NOTES'
          A single self-contained executable that turns a directory of
          FITS/XISF frames into the acquisition CSV and session summary
          AstroBin's bulk importer expects. No Python, no libraries, nothing
          to install.

          Output is byte-for-byte identical to
          [AstroBinUploader](https://github.com/SteveGreaves/AstroBinUploader)
          v2.2.1 -- the same CSV, the same summary, the same `--debug` files
          and the same log.

          ### Why use this instead

          - **Nothing to install.** One file. No Python, no `pip`, no virtual
            environment, no libraries. Download it, make it executable, run it.
          - **Nothing to go wrong.** No `ModuleNotFoundError`, no
            `externally-managed-environment`, no pinned library versions that
            clash with other software on your machine, and nothing to
            reinstall when your operating system updates its Python.
          - **Faster.** It starts instantly -- there is no interpreter to load
            and no large scientific libraries to import before the first frame
            is read -- and it reads headers on all your CPU cores.
          - **Runs anywhere.** Windows, Linux and macOS, on both Intel/AMD and
            ARM. The Linux build is statically linked, so it works on any
            distribution without matching system libraries.
          - **Same results.** It is not a reimplementation that behaves "close
            enough" -- every output file is compared byte for byte against the
            Python utility.

          ### Which file do I want?

          | Archive | For |
          |---|---|
          | `x86_64-unknown-linux-musl` | Linux, Intel/AMD (static -- any distribution) |
          | `x86_64-pc-windows-msvc` | Windows, Intel/AMD |
          | `aarch64-pc-windows-msvc` | Windows on ARM |
          | `x86_64-apple-darwin` | macOS, Intel |
          | `aarch64-apple-darwin` | macOS, Apple Silicon |

          ### Getting started

          Extract the archive, copy `config.ini.example` to `config.ini` and
          edit it for your site and filters, then:

          ```
          astrobin-upload "/path/to/my/images/Sadr Region"
          ```

          `README.md` in the archive is the full manual.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $(find packages -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
